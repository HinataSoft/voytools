[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voytools"
version = "0.1.0"
description = "Statistical analysis of Voynich manuscript transliterations in IVTFF 2.0 format"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
parquet = ["pyarrow"]
dev = ["pytest>=7"]

[project.scripts]
voytools = "voytools.cli:main"

[tool.setuptools]
packages = ["voytools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
